name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel previous runs on same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Python lint ──────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install lint tools
        run: pip install ruff black

      - name: ruff check
        run: ruff check .

      - name: black check
        run: black --check .

  # ── 2. Django tests ─────────────────────────────────────────────────────────
  test-django:
    name: Django Tests (pytest)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
      CORS_ALLOWED_ORIGINS: ""
      FERTILIZER_USE_MOCK: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements/dev.txt
        # Note: torch is large; in CI we install CPU-only
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run pytest with coverage
        run: |
          pytest chatbot_app/tests.py -v --tb=short \
            --cov=chatbot_app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── 3. React lint ───────────────────────────────────────────────────────────
  lint-web:
    name: Lint Web (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: ESLint
        run: npm --prefix web run lint

  # ── 4. React tests ──────────────────────────────────────────────────────────
  test-web:
    name: React Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Generate offline intents
        run: npm --prefix web run prebuild

      - name: Run Vitest
        run: npm --prefix web run test

  # ── 5. Web build ────────────────────────────────────────────────────────────
  build-web:
    name: Web Build (Vite)
    runs-on: ubuntu-latest
    needs: [lint-web, test-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Build
        run: npm --prefix web run build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7
